# Desarrollo local: Postgres + backend + frontend.
# Para producción usar docker-compose.prod.yml (ver la guía de traspaso).
#
# Nota: este compose levanta el frontend ya compilado, igual que en producción.
# Para desarrollo activo del frontend (recarga en caliente) sigue siendo mejor
# "cd frontend && npm run dev" y levantar aquí solo db y backend:
#   docker compose up db backend

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      POSTGRES_DB: guia_digital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:7860"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-54321}@db:5432/guia_digital
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Se hornea en el build. En local apunta al backend publicado arriba.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    environment:
      # Llamadas de servidor a servidor (NextAuth valida el token de Google
      # contra el backend). Van por la red interna de Docker: dentro de este
      # contenedor "localhost" no es el backend.
      BACKEND_INTERNAL_URL: http://backend:7860/api
    # Variables de runtime de NextAuth (AUTH_SECRET, AUTH_URL, AUTH_GOOGLE_*)
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  postgres_data:
