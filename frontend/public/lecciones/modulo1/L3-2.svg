<svg width="100%" viewBox="0 0 380 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Para qué sirve el chatbot de IA</title>
  <desc>Un chatbot de IA que ayuda con tres cosas: explicar palabras, información de salud y recordatorios</desc>

  <defs>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.7; transform:scale(1.08)} }
      .fl1 { animation: float 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .fl2 { animation: float 2.6s ease-in-out -0.9s infinite; transform-origin: center; transform-box: fill-box; }
      .fl3 { animation: float 2.6s ease-in-out -1.8s infinite; transform-origin: center; transform-box: fill-box; }
      .dot { animation: pulse 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .dot2 { animation: pulse 1.4s ease-in-out -0.4s infinite; transform-origin: center; transform-box: fill-box; }
      .dot3 { animation: pulse 1.4s ease-in-out -0.8s infinite; transform-origin: center; transform-box: fill-box; }
    </style>
  </defs>

  <!-- ══ CHATBOT CENTRAL (burbuja grande con cara amigable) ══ -->
  <g transform="translate(190,110)">
    <!-- Sombra suave debajo -->
    <ellipse cx="0" cy="78" rx="60" ry="6" fill="#000" opacity="0.06"/>

    <!-- Burbuja de chat (forma message-circle) -->
    <path d="M-66,-8 C-66,-44 -36,-72 0,-72 C36,-72 66,-44 66,-8 C66,28 36,56 0,56 C-10,56 -19,54.5 -27,51.5 L-56,62 L-49,33 C-60,21 -66,7 -66,-8 Z"
          fill="#1b4f7a" stroke="#1b4f7a" stroke-width="2" stroke-linejoin="round"/>

    <!-- Antenita arriba (look de robot/asistente) -->
    <line x1="0" y1="-72" x2="0" y2="-82" stroke="#1b4f7a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-86" r="4" fill="#b85c00"/>

    <!-- Ojos del chatbot -->
    <circle cx="-18" cy="-18" r="6" fill="#fff"/>
    <circle cx="18" cy="-18" r="6" fill="#fff"/>
    <circle cx="-17" cy="-17" r="2.5" fill="#1a1a1a"/>
    <circle cx="19" cy="-17" r="2.5" fill="#1a1a1a"/>

    <!-- Sonrisa amigable -->
    <path d="M-14,8 Q0,20 14,8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <!-- Tres puntitos de "escribiendo..." debajo de la sonrisa -->
    <g transform="translate(0,30)">
      <circle class="dot"  cx="-10" cy="0" r="2.5" fill="#fff"/>
      <circle class="dot2" cx="0"   cy="0" r="2.5" fill="#fff"/>
      <circle class="dot3" cx="10"  cy="0" r="2.5" fill="#fff"/>
    </g>
  </g>

  <!-- ══ TRES BURBUJAS PEQUEÑAS ALREDEDOR (lo que el chatbot ofrece) ══ -->

  <!-- BURBUJA 1 · LIBRO (explicar palabras) — abajo-izquierda -->
  <g class="fl1">
    <circle cx="76" cy="270" r="46" fill="#e8eef4" stroke="#1b4f7a" stroke-width="2.5"/>
    <!-- icono libro abierto -->
    <g transform="translate(76,270)" fill="#fff" stroke="#1b4f7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22,-15 L-3,-15 C-1.5,-15 0,-13.5 0,-12 L0,18 C0,16.5 -1.5,15 -3,15 L-22,15 Z"/>
      <path d="M22,-15 L3,-15 C1.5,-15 0,-13.5 0,-12 L0,18 C0,16.5 1.5,15 3,15 L22,15 Z"/>
    </g>
    <g transform="translate(76,270)" fill="none" stroke="#1b4f7a" stroke-width="2" stroke-linecap="round">
      <line x1="-17" y1="-6" x2="-7" y2="-6"/>
      <line x1="-17" y1="1"  x2="-7" y2="1"/>
      <line x1="-17" y1="8"  x2="-7" y2="8"/>
      <line x1="7" y1="-6" x2="17" y2="-6"/>
      <line x1="7" y1="1"  x2="17" y2="1"/>
      <line x1="7" y1="8"  x2="17" y2="8"/>
    </g>
  </g>
  <!-- línea punteada del chatbot a la burbuja 1 -->
  <line x1="142" y1="186" x2="100" y2="232" stroke="#1b4f7a" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- BURBUJA 2 · CORAZÓN-SALUD (información) — abajo-centro -->
  <g class="fl2">
    <circle cx="190" cy="290" r="46" fill="#e3eee5" stroke="#2d6e3e" stroke-width="2.5"/>
    <!-- icono corazón con cruz médica -->
    <g transform="translate(190,290)">
      <path d="M0,20 C-9,13 -22,5 -22,-6 C-22,-13 -16,-19 -8,-19 C-3,-19 0,-16 0,-12 C0,-16 3,-19 8,-19 C16,-19 22,-13 22,-6 C22,5 9,13 0,20 Z"
            fill="#fff" stroke="#2d6e3e" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="-3" y="-9" width="6" height="16" rx="1.2" fill="#2d6e3e"/>
      <rect x="-9" y="-3" width="16" height="6" rx="1.2" fill="#2d6e3e"/>
    </g>
  </g>
  <!-- línea punteada del chatbot a la burbuja 2 -->
  <line x1="190" y1="186" x2="190" y2="244" stroke="#2d6e3e" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- BURBUJA 3 · CAMPANA (recordatorios) — abajo-derecha -->
  <g class="fl3">
    <circle cx="304" cy="270" r="46" fill="#fff4e6" stroke="#b85c00" stroke-width="2.5"/>
    <!-- icono campana -->
    <g transform="translate(304,270)">
      <line x1="0" y1="-22" x2="0" y2="-18" stroke="#b85c00" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-16,10 C-16,10 -13,6 -13,-3 C-13,-11 -7,-18 0,-18 C7,-18 13,-11 13,-3 C13,6 16,10 16,10 Z"
            fill="#fff" stroke="#b85c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-16" y1="10" x2="16" y2="10" stroke="#b85c00" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-4,13 C-4,16 -2,18 0,18 C2,18 4,16 4,13" fill="none" stroke="#b85c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- punto rojo de notificación -->
      <circle cx="12" cy="-12" r="5" fill="#b02e2e" stroke="#fff" stroke-width="2"/>
    </g>
  </g>
  <!-- línea punteada del chatbot a la burbuja 3 -->
  <line x1="238" y1="186" x2="280" y2="232" stroke="#b85c00" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.5"/>

</svg>
