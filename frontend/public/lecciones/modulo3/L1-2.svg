<svg width="100%" viewBox="0 0 380 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Lo que NO debes hacer con la IA</title>
  <desc>Tres usos prohibidos de la IA en salud: autodiagnóstico, cambiar medicación y reemplazar al doctor</desc>

  <defs>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      .f1 { animation: float 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .f2 { animation: float 2.6s ease-in-out -0.9s infinite; transform-origin: center; transform-box: fill-box; }
      .f3 { animation: float 2.6s ease-in-out -1.8s infinite; transform-origin: center; transform-box: fill-box; }
    </style>
  </defs>

  <!-- ══ ICONO 1 · AUTODIAGNÓSTICO (arriba-izquierda) ══ -->
  <g class="f1">
    <circle cx="100" cy="80" r="56" fill="#fde8e8" stroke="#b02e2e" stroke-width="2.5"/>
    <g transform="translate(100,80)">
      <circle cx="-6" cy="-13" r="11" fill="#fff" stroke="#1b4f7a" stroke-width="2.5"/>
      <path d="M-21,17 C-21,5 -15,-1 -6,-1 C3,-1 9,5 9,17 Z" fill="#fff" stroke="#1b4f7a" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="14" y="-9" font-family="sans-serif" font-size="22" font-weight="700" fill="#b02e2e">?</text>
    </g>
    <g opacity="0.85">
      <circle cx="100" cy="80" r="46" fill="none" stroke="#b02e2e" stroke-width="5"/>
      <line x1="68" y1="112" x2="132" y2="48" stroke="#b02e2e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="100" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b02e2e">NO autodiagnóstico</text>

  <!-- ══ ICONO 2 · CAMBIAR MEDICACIÓN (arriba-derecha) ══ -->
  <g class="f2">
    <circle cx="280" cy="80" r="56" fill="#fde8e8" stroke="#b02e2e" stroke-width="2.5"/>
    <g transform="translate(280,80) rotate(-30)">
      <path d="M-24,-9 L-2,-9 L-2,9 L-24,9 C-29,9 -33,5 -33,0 C-33,-5 -29,-9 -24,-9 Z"
            fill="#1b4f7a" stroke="#1b4f7a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24,-9 L2,-9 L2,9 L24,9 C29,9 33,5 33,0 C33,-5 29,-9 24,-9 Z"
            fill="#fff" stroke="#1b4f7a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#1b4f7a" stroke-width="2"/>
    </g>
    <g opacity="0.85">
      <circle cx="280" cy="80" r="46" fill="none" stroke="#b02e2e" stroke-width="5"/>
      <line x1="248" y1="112" x2="312" y2="48" stroke="#b02e2e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="280" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b02e2e">NO cambiar medicación</text>

  <!-- ══ ICONO 3 · REEMPLAZAR AL DOCTOR (abajo, centrado) ══ -->
  <g class="f3">
    <circle cx="190" cy="240" r="56" fill="#fde8e8" stroke="#b02e2e" stroke-width="2.5"/>
    <g transform="translate(190,240)" fill="none" stroke="#1b4f7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16,-18 L-16,-4 C-16,6 -10,12 -2,12"/>
      <path d="M10,-18 L10,-4 C10,6 4,12 -2,12"/>
      <circle cx="-16" cy="-20" r="2.5" fill="#1b4f7a"/>
      <circle cx="10" cy="-20" r="2.5" fill="#1b4f7a"/>
      <path d="M-2,12 L-2,20"/>
      <circle cx="-2" cy="24" r="6" fill="#fff"/>
    </g>
    <g opacity="0.85">
      <circle cx="190" cy="240" r="46" fill="none" stroke="#b02e2e" stroke-width="5"/>
      <line x1="158" y1="272" x2="222" y2="208" stroke="#b02e2e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="190" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b02e2e">NO reemplaza al doctor</text>

</svg>
