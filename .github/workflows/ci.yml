name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # NOTA: el repo tiene deuda de lint preexistente (imports desordenados,
      # espacios en blanco, etc.) ajena a este workflow. Se reporta pero no
      # bloquea el build hasta que se limpie; luego se puede quitar el
      # continue-on-error para que sea un gate real.
      - name: Ruff (informativo)
        run: ruff check .
        continue-on-error: true

      - name: Tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # NOTA: mismo caso que ruff en el backend — hay errores de ESLint
      # preexistentes sin relación con este workflow.
      - name: ESLint (informativo)
        run: npm run lint
        continue-on-error: true
