# Configuración compartida de SonarQube. Sirve igual para:
#   - el servidor local en Docker (ver docs/sonarqube.md)
#   - SonarQube Cloud desde el CI
#
# sonar.organization NO va aquí porque solo existe en la versión Cloud: el CI lo
# pasa como argumento. Así este archivo funciona en los dos escenarios.
sonar.projectKey=HIN0_Guia_Digital_AdultoMayor
sonar.projectName=Guia Digital Adulto Mayor

# ── Qué se analiza ──────────────────────────────────────────────────────────
sonar.sources=backend,frontend/src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Los tests se declaran aparte para que Sonar no los cuente como código de
# producción (si no, inflan las métricas y reportan smells sobre los asserts).
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*,frontend/src/**/__tests__/**/*

# ── Qué se excluye ──────────────────────────────────────────────────────────
sonar.exclusions=\
  backend/venv/**,\
  backend/alembic/**,\
  backend/seed.py,\
  backend/tests/**,\
  frontend/src/**/__tests__/**,\
  frontend/.next/**,\
  **/node_modules/**,\
  **/__pycache__/**

# seed.py se excluye del análisis por ser ~2.300 líneas de contenido educativo
# en literales, no lógica. Si algún día se le agrega lógica real, sacarlo de aquí.

# ── Cobertura ───────────────────────────────────────────────────────────────
# Estos archivos los generan los jobs del CI antes de invocar al scanner.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# El lcov de Vitest escribe rutas relativas a frontend/ (SF:src/...), mientras que
# Sonar las resuelve desde la raíz del repo. El CI las reescribe a frontend/src/...
# antes de este paso; si se corre el scanner a mano, hay que hacer lo mismo.
